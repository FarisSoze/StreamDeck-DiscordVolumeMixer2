name: Build and test Windows plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: python tests/verify_distribution.py
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.2.4'
          arch: win64_msvc2019_64
          modules: qtwebsockets
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_RECOVERY_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy runtime
        run: cmake --install build --config Release
      - name: Native protocol regression test
        shell: pwsh
        run: |
          $env:DVM_TEST_EXECUTABLE = (Resolve-Path 'bin/Release/com.farissoze.discordvoicemixerfix.sdPlugin/bin/streamdeck-discordmixer.exe').Path
          $env:DVM_AUTH_PROBE = (Resolve-Path 'build/tests/qdiscord-auth-probe.exe').Path
          $env:PATH = (Split-Path $env:DVM_TEST_EXECUTABLE) + ';' + $env:PATH
          npm test
      - name: Package plugin
        shell: pwsh
        run: |
          Compress-Archive -Path bin/Release/com.farissoze.discordvoicemixerfix.sdPlugin -DestinationPath DiscordVoiceMixer-FIX-1.0.0.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordVoiceMixer-FIX-1.0.0.1-windows
          path: DiscordVoiceMixer-FIX-1.0.0.1.zip
          if-no-files-found: error
