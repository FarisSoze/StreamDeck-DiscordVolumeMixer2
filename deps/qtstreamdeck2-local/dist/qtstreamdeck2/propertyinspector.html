<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        .dvm-connection { margin: 8px 12px 16px; line-height: 1.6; text-align: right; }
        .dvm-connection strong { display: block; color: #f2f2f2; }
        .dvm-connection p { margin: 4px 0 10px; color: #dedede; overflow-wrap: anywhere; }
        .dvm-connection button { display: block; width: 100%; margin: 8px 0 0; min-height: 30px; }
        .dvm-connection button:focus-visible { outline: 2px solid #b8d7ff; outline-offset: 2px; }
        .dvm-connection button:disabled { cursor: wait; }
    </style>
    <link rel="stylesheet" href="sdpi.css">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<div id="connectionStatus" role="status" aria-live="polite" hidden></div>
<div class="sdpi-wrapper" id="body">
    <details class="message">
        <summary>Loading property inspector...</summary>
    </details>
</div>
<script src="propertyinspector.js"></script>
</body>
</html>
